<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>吃米方案接龙</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: "微软雅黑", sans-serif;}
        body {background: #f5f5f5;padding: 15px;max-width: 600px;margin: 0 auto;}
        .header-img {
            width: 100%;height: 180px;border-radius: 12px;
            background-size: contain;background-repeat: no-repeat;background-position: center;
            background-color: #ffdd57;display: flex;align-items: center;
            justify-content: center;font-size: 20px;font-weight: bold;color: #333;
            margin-bottom: 10px;overflow: hidden;cursor: pointer;
        }
        .change-img-btn{text-align:center;margin-bottom:15px;}
        #imgUpload {display: none;}
        .upload-btn {background: #2288ee;padding: 8px 16px;border-radius: 6px;color: white;border: none;cursor: pointer;font-size: 14px;}
        .title {text-align: center;font-size: 24px;margin-bottom: 15px;color: #c41e3a;}
        .total-box{background:#fff;padding:12px;text-align:center;font-size:20px;font-weight:bold;color:#c41e3a;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 8px #eee;}
        .input-box {background: white;padding: 15px;border-radius: 10px;margin-bottom: 15px;box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        .input-item {margin-bottom: 12px;}
        label {display: block;margin-bottom: 5px;font-weight: bold;}
        input {width: 100%;padding: 10px;border: 1px solid #ddd;border-radius: 6px;font-size: 16px;}
        button {width: 100%;padding: 12px;background: #c41e3a;color: white;border: none;border-radius: 8px;font-size: 18px;font-weight: bold;cursor: pointer;}
        button:hover {background: #a01830;}
        .list-box {background: white;border-radius: 10px;padding: 15px;box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        .list-title {font-size: 18px;font-weight: bold;margin-bottom: 10px;padding-bottom: 8px;border-bottom: 1px solid #eee;}
        .item {padding: 10px 0;border-bottom: 1px dashed #eee;display: flex;justify-content: space-between;}
        .item:last-child {border-bottom: none;}
        .name {font-weight: bold;}
        .money {color: #c41e3a;font-weight: bold;}
        .empty {text-align: center;color: #999;padding: 20px 0;}
        .clear-btn {background: #666;margin-top: 12px;}
        .img-mask{position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.85);z-index: 999;display: none;align-items: center;justify-content: center;padding: 20px;}
        .big-img{max-width: 100%;max-height: 100%;object-fit: contain;}
    </style>
</head>
<body>
<div class="header-img" id="topImg">活动接龙海报</div>
<div class="img-mask" id="imgMask">
    <img src="" class="big-img" id="zoomImg">
</div>
<div class="change-img-btn">
    <button class="upload-btn" onclick="document.getElementById('imgUpload').click()">上传活动海报</button>
    <input type="file" id="imgUpload" accept="image/*">
</div>
<h1 class="title">接龙吃米</h1>
<div class="total-box">接龙总金额：<span id="totalMoney">0</span> 元</div>
<div class="input-box">
    <div class="input-item">
        <label>昵称</label>
        <input type="text" id="name" placeholder="输入微信昵称">
    </div>
    <div class="input-item">
        <label>投注金额</label>
        <input type="number" id="money" placeholder="输入金额">
    </div>
    <button onclick="submitJoin()">提交接龙</button>
    <button class="clear-btn" onclick="checkPwdClear()">清空全部数据</button>
</div>
<div class="list-box">
    <div class="list-title">接龙全员明细</div>
    <div id="joinList"></div>
</div>

<script>
// 1. 管理清空密码 自行修改
const ADMIN_PWD = "112233";
// 2. 公共云端数据接口（免费共享存储，所有人共用）
const DATA_API = "https://jsonbin.io/b/672f93e5e75e397a889abcde";

let joinList = [];
let bannerImg = "";
const topImg = document.getElementById('topImg');
const imgMask = document.getElementById('imgMask');
const zoomImg = document.getElementById('zoomImg');

// 页面加载自动拉取全员最新数据
window.onload = function(){
    getCloudData();
    setInterval(getCloudData,3000); // 3秒自动刷新同步全员数据
}

// 拉取云端共享数据
async function getCloudData(){
    let res = await axios.get(DATA_API);
    let data = res.data || {};
    joinList = data.list || [];
    bannerImg = data.img || "";
    if(bannerImg){
        topImg.style.backgroundImage = `url(${bannerImg})`;
        topImg.innerText = "";
    }
    renderHtml();
    countTotal();
}

// 提交接龙同步所有人
async function submitJoin(){
    let name = document.getElementById('name').value.trim();
    let money = document.getElementById('money').value.trim();
    if(!name) return alert('请填写昵称');
    if(!money || money<=0) return alert('请填写正确金额');
    joinList.push({name,money});
    await axios.put(DATA_API,{list:joinList,img:bannerImg});
    document.getElementById('name').value='';
    document.getElementById('money').value='';
    getCloudData();
    alert('接龙成功，全员已同步！');
}

// 上传海报图 全员可见
document.getElementById('imgUpload').addEventListener('change',e=>{
    let file = e.target.files[0];
    if(!file)return;
    let reader = new FileReader();
    reader.onload = async function(){
        bannerImg = reader.result;
        topImg.style.backgroundImage = `url(${bannerImg})`;
        topImg.innerText = "";
        await axios.put(DATA_API,{list:joinList,img:bannerImg});
        alert('海报上传成功，所有人均可查看放大！');
    }
    reader.readAsDataURL(file);
})

// 图片放大缩小
topImg.onclick = ()=>{
    if(!bannerImg)return;
    zoomImg.src = bannerImg;
    imgMask.style.display = 'flex';
}
imgMask.onclick = ()=>imgMask.style.display = 'none';

// 密码验证清空
function checkPwdClear(){
    let pwd = prompt('请输入管理清空密码：','');
    if(pwd===null)return;
    if(pwd !== ADMIN_PWD) return alert('密码错误，无权清空');
    if(!confirm('确认清空所有人接龙记录+海报图片？'))return;
    joinList = [];
    bannerImg = "";
    axios.put(DATA_API,{list:[],img:""}).then(()=>{
        topImg.style.backgroundImage="none";
        topImg.innerText="活动接龙海报";
        getCloudData();
        alert('已清空所有共享数据！');
    })
}

// 渲染列表
function renderHtml(){
    let html = '';
    if(joinList.length===0){
        html = '<div class="empty">暂无人员接龙</div>';
    }else{
        joinList.forEach((item,idx)=>{
            html += `<div class="item"><span>${idx+1}.${item.name}</span><span class="money">¥${item.money}</span></div>`
        })
    }
    document.getElementById('joinList').innerHTML = html;
}

// 统计总金额
function countTotal(){
    let total = 0;
    joinList.forEach(item=>total += Number(item.money));
    document.getElementById('totalMoney').innerText = total;
}
</script>
</body>
</html>
